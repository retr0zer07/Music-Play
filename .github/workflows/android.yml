name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Sphere-Music.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sphere-Music-Android
          path: Sphere-Music.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Sphere-Music-Android
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" Sphere-Music.apk \
            --title "Sphere Music $RELEASE_TAG" \
            --prerelease \
            --notes "Vista previa Android. APK de depuración para pruebas, no firmado para producción. Consulta el README para instalación, funciones y limitaciones."
