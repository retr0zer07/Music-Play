name: Android device regressions

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android APK workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download matched APKs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          gh run download "$BUILD_RUN" --name Sphere-Music-Android --dir apks
          gh run download "$BUILD_RUN" --name Sphere-Music-Device-Tests --dir apks
      - name: Run Android regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apks/Sphere-Music.apk
            adb install apks/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w com.spheremusic.app.test/androidx.test.runner.AndroidJUnitRunner | tee device-results.txt
            adb logcat -d > device-logcat.txt
            if adb shell test -d /sdcard/Android/data/com.spheremusic.app/files/visual-checks; then adb pull /sdcard/Android/data/com.spheremusic.app/files/visual-checks visual-checks; fi
            grep -E '^OK \([0-9]+ tests?\)' device-results.txt
            if grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' device-results.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            device-results.txt
            device-logcat.txt
            visual-checks/
